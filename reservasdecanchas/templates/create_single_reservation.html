{% extends 'layout.html' %}

{% block title %}Reserva puntual{% endblock %}

{% block content %}
<h1>Crear reserva puntual</h1>

{% if messages %}
    <ul class="messages">
        {% for m in messages %}<li>{{ m }}</li>{% endfor %}
    </ul>
{% endif %}

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Crear slot</button>
</form>
{% endblock %}
