<div class="modal fade show" id="modal" style="display: block; background: rgba(0,0,0,0.5);" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">{{ service.name }}</h5>
        <button type="button" class="btn-close" onclick="document.getElementById('modal-container').innerHTML = ''"></button>
      </div>

      <div class="modal-body">
        <div id="calendar-{{ service.id }}"></div>    
        <div id="horarios-{{ service.id }}"></div>
        <div id="confirmacion-{{ service.id }}"></div>    
      </div>

    </div>
  </div>
</div>
